<VirtualHost *:80>
    ServerName eddytester.com
    ServerAlias www.eddytester.com
    ServerAlias learn.eddytester.com
    DocumentRoot /var/www/eddytester.com

    <Directory /var/www/eddytester.com>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex page101918416.html

    ErrorLog /eddytester.com_error.log
    CustomLog /eddytester.com_access.log combined

    RewriteEngine On

    # Force HTTPS
    RewriteCond %{HTTPS} off
    # Не редиректить запросы через Cloudflare-прокси (иначе петля 301 при SSL-режиме Flexible)
    RewriteCond %{HTTP:X-Forwarded-Proto} !https
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    RewriteRule ^api-practicum/?$ /page101918416.html [L]

    ProxyPass /check-key http://localhost:3456/check-key
ProxyPass /bugs http://localhost:3000/bugs
ProxyPassReverse /bugs http://localhost:3000/bugs
ProxyPass /receipt http://localhost:3000/receipt
ProxyPassReverse /receipt http://localhost:3000/receipt
    ProxyPassReverse /check-key http://localhost:3456/check-key
ProxyPass /create-payment http://localhost:3457/create-payment
ProxyPassReverse /create-payment http://localhost:3457/create-payment
</VirtualHost>
