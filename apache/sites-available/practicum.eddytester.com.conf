<VirtualHost *:80>
    ServerName practicum.eddytester.com

    ErrorLog /practicum.eddytester.com_error.log
    CustomLog /practicum.eddytester.com_access.log combined

    ProxyPreserveHost On
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/
RewriteEngine on
RewriteCond %{SERVER_NAME} =practicum.eddytester.com
# Не редиректить запросы, пришедшие через Cloudflare-прокси (X-Forwarded-Proto: https) —
# иначе при SSL-режиме Flexible получается петля 301 (CF → origin:80 → https → CF...)
RewriteCond %{HTTP:X-Forwarded-Proto} !https
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
